# SwarmPool API 站点（vps87 /etc/nginx/sites-available/swarmpool.conf）
# 仅匹配 swarmpool.duckdns.org，不影响机器上其它站点
# 443 块的 ssl 指令由 certbot 管理；本文件与 certbot 的改动保持同步

server {
    server_name swarmpool.duckdns.org;

    # ---- 静态分发（安装脚本/二进制/技能卡）----
    location = /install.sh {
        alias /var/www/swarmpool/install.sh;
        default_type text/x-shellscript;
    }
    location = /spark-linux-amd64 {
        alias /var/www/swarmpool/spark-linux-amd64;
        default_type application/octet-stream;
    }
    location = /deploy.md {
        alias /var/www/swarmpool/deploy.md;
        default_type text/markdown;
    }
    location = /connect.md {
        alias /var/www/swarmpool/connect.md;
        default_type text/markdown;
    }

    # ACME HTTP-01 验证路径
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # ---- 控制面 API ----
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/swarmpool.duckdns.org/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/swarmpool.duckdns.org/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = swarmpool.duckdns.org) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name swarmpool.duckdns.org;
    return 404; # managed by Certbot
}
